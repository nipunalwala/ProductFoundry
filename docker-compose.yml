services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-productfoundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-productfoundry}
      POSTGRES_DB: ${POSTGRES_DB:-productfoundry}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs the stages of queued runs with the same orchestrator the CLI uses. RQ's worker
  # does not run natively on Windows, so it lives here.
  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-productfoundry}:${POSTGRES_PASSWORD:-productfoundry}@db:5432/${POSTGRES_DB:-productfoundry}
      REDIS_URL: redis://redis:6379/0
      FAKE_STAGES: ${FAKE_STAGES:-false}
      REVIEW_CAP: ${REVIEW_CAP:-2000}
      # Model downloads through the Xet backend stalled on the development network.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - model-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
  model-cache:
