# Embedding and clustering settings. Stage 3 reads these; the run's seed comes from the run.

[embeddings]
# Chosen in phase 6 by comparing candidates on English/Hinglish pairs
# (backend/eval/embedding_models.py; scores in docs/BUILD_SPEC.md).
model = "intfloat/multilingual-e5-small"
dimension = 384
batch_size = 32
prefix = "query: "        # this model expects it before each text

[clustering]
umap_neighbors = 15
umap_components = 5
umap_metric = "cosine"
min_cluster_size = 8      # fewer reviews than this cannot form a cluster
min_samples = 3
representatives = 5       # sample reviews kept per cluster
# Multilingual models place a Hinglish review nearer to other Hinglish reviews
# than to an English review of the same complaint. Subtracting each language's
# mean vector removes that offset. A language with fewer reviews than this
# shares the mean of all reviews instead, because its own mean would be noise.
min_language_group = 10

[trends]
months = 12               # length of each series, ending at the month of the latest review
window_months = 3         # growth = share over the last 3 months versus the 3 before
min_month_reviews = 5     # a month with fewer reviews in total is marked, not plotted
min_window_reviews = 15   # a window with fewer reviews in total gives no growth figure
rising_threshold = 0.25   # a share that grew by more than a quarter is flagged as rising

[switching]
# A review is a candidate when it matches the keyword list or sits this close to one of
# the seed sentences (cosine similarity after per-language centring). Chosen on the 191
# stored Splitwise reviews: 14 keyword hits and 8 more by similarity, with no overlap.
similarity = 0.3
batch_size = 20           # candidates per LLM call
max_candidates = 400      # per run; the most similar are kept when there are more
