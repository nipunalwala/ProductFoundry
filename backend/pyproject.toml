[project]
name = "productfoundry"
version = "0.1.0"
description = "AI product manager agent: turns a software product idea into an evidence-backed build plan."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
productfoundry = "productfoundry.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/productfoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
