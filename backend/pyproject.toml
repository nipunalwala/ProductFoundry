[project]
name = "productfoundry"
version = "0.1.0"
description = "AI product manager agent: turns a software product idea into an evidence-backed build plan."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "google-play-scraper>=1.2",
    "httpx>=0.27",
    "langdetect>=1.0.9",
    "litellm>=1.50",
    "pgvector>=0.3",
    "playwright>=1.47",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pytrends>=4.9",
    "redis>=5.0",
    "rq>=2.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0",
    # Named only so that the Linux worker image gets the CPU build (see tool.uv.sources).
    "torch>=2.3",
    "umap-learn>=0.5.6",
    "uvicorn>=0.30",
]

[project.scripts]
productfoundry = "productfoundry.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# The queue worker runs in a Linux container with no GPU. PyPI's Linux torch pulls
# several gigabytes of CUDA libraries; PyTorch's CPU index does not.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/productfoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
